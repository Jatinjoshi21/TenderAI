<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tender Intelligence</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <h1>Tender Intelligence System</h1>
    <p>AI-powered tender evaluation with explainability</p>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="main-container">
    <!-- UPLOAD SECTION -->
<section class="upload-section">

  <div class="upload-card">
    <h3>📄 Tender Document</h3>
    <input type="file" id="tenderFile">
  </div>

  <div class="upload-card">
    <h3>🏢 Bidder Document</h3>
    <input type="file" id="bidderFile">
  </div>

</section>

<div class="action">
  <button id="analyzeBtn">Analyze Tender</button>
</div>

<!-- PREVIEW SECTION -->
<section class="preview-section">

  <div class="preview-card">
    <h3>📄 Tender Preview</h3>
    <iframe id="tenderPreview"></iframe>
  </div>

  <div class="preview-card">
    <h3>🏢 Bidder Preview</h3>
    <iframe id="bidderPreview"></iframe>
  </div>

</section>

<!-- RESULT HERO -->
<section class="result-hero hidden" id="resultHero">

  <div class="decision-box">
    <h2>Final Decision</h2>
    <div id="finalStatus" class="status-text">—</div>
  </div>

  <div class="summary-box">
    <h3>🧠 AI Summary</h3>
    <p id="summaryBox">Waiting for analysis...</p>
  </div>

</section>

<!-- INSIGHTS SECTION -->
<section class="insights hidden" id="insightsSection">

  <div class="insight-card">
    <h3>📊 Confidence Scores</h3>
    <div id="confidenceBox"></div>
  </div>

  <div class="insight-card">
    <h3>🧾 Audit Trail</h3>
    <div id="auditBox"></div>
  </div>

</section>

<!-- DETAILED RESULTS -->
<section class="results-section hidden" id="resultsSection">

  <h2>📊 Evaluation Breakdown</h2>

  <div id="resultsContainer"></div>

</section>

  </main>
<div id="loader" class="hidden"></div>
</body>
<script src="script.js"></script>
</html>
